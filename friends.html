<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เพื่อน — NUMVERSE</title>
<link rel="icon" href="numverse.png" type="image/png">
<link rel="stylesheet" href="auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>เพื่อน</h1>
    <p class="sub" id="sub">กำลังโหลด…</p>

    <div id="codeBox" class="hidden">
      <p class="tiny" style="text-align:left;margin:0 0 6px">รหัสเพื่อนของคุณ</p>
      <div class="friend-code-row">
        <code id="myCode">—</code>
        <button class="btn ghost" id="copyCode" type="button" style="width:auto;margin:0;padding:8px 12px">คัดลอก</button>
      </div>
    </div>

    <h1 style="margin-top:22px;font-size:1.05rem;text-align:left">เพิ่มเพื่อน</h1>
    <form id="codeForm">
      <label>รหัสเพื่อน
        <input id="friendCodeInput" type="text" maxlength="16" placeholder="NV-XXXXXX" autocomplete="off">
      </label>
      <button class="btn" type="submit">ส่งคำขอด้วยรหัส</button>
    </form>

    <label style="margin-top:14px">ค้นหาจากชื่อ
      <input id="searchInput" type="text" maxlength="64" placeholder="พิมพ์อย่างน้อย 2 ตัวอักษร" autocomplete="off">
    </label>
    <ul class="list" id="searchResults"></ul>

    <h1 style="margin-top:22px;font-size:1.05rem;text-align:left">คำขอเข้า</h1>
    <ul class="list" id="incoming"></ul>
    <p class="tiny" id="incomingEmpty">ไม่มีคำขอ</p>

    <h1 style="margin-top:22px;font-size:1.05rem;text-align:left">คำขอที่ส่ง</h1>
    <ul class="list" id="outgoing"></ul>
    <p class="tiny" id="outgoingEmpty">ยังไม่ได้ส่งคำขอ</p>

    <h1 style="margin-top:22px;font-size:1.05rem;text-align:left">เพื่อน</h1>
    <ul class="list" id="friends"></ul>
    <p class="tiny" id="friendsEmpty">ยังไม่มีเพื่อน</p>

    <p class="msg" id="msg"></p>
    <p class="links"><a href="account.html">บัญชี</a> · <a href="/">กลับล็อบบี้</a></p>
  </div>
</div>
<script src="auth-client.js"></script>
<script>
function $(id){return document.getElementById(id)}
function show(el,on){el.classList.toggle("hidden",!on)}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]))}

function userRow(u){
  const av=u.avatarUrl
    ? '<img class="friend-av" src="'+esc(u.avatarUrl)+'" alt="" width="32" height="32" referrerpolicy="no-referrer">'
    : '<span class="friend-av ph">'+(esc((u.displayName||"?").slice(0,1).toUpperCase()))+'</span>';
  return '<div class="friend-meta">'+av+'<div><div>'+esc(u.displayName)+'</div>'+(u.friendCode?'<div class="tiny">'+esc(u.friendCode)+'</div>':'')+'</div></div>';
}

function btn(label,cls){
  const b=document.createElement("button");
  b.className="btn ghost"+(cls?" "+cls:"");
  b.style.width="auto";
  b.style.margin="0";
  b.style.padding="8px 12px";
  b.textContent=label;
  return b;
}

async function sendRequest(body){
  const {res,data}=await api("/api/v1/friends/request",{method:"POST",body:JSON.stringify(body)});
  const map={
    user_not_found:"ไม่พบผู้ใช้นี้",
    cannot_friend_self:"เพิ่มตัวเองไม่ได้",
    already_friends:"เป็นเพื่อนกันอยู่แล้ว",
    request_pending:"มีคำขอค้างอยู่แล้ว",
    registered_required:"ต้องผูกบัญชีก่อน"
  };
  const err=data&&data.error;
  setMsg($("msg"), res.ok?"ส่งคำขอแล้ว":(map[err]||err||"ล้มเหลว"), res.ok);
  if(res.ok) refresh();
}

async function refresh(){
  const me=await api("/api/v1/auth/me",{method:"GET",headers:{Accept:"application/json"}});
  if(!me.res.ok){
    $("sub").textContent="ยังไม่ได้เข้าสู่ระบบ";
    location.href="login.html";
    return;
  }
  if(me.data.user.accountType!=="registered"){
    $("sub").textContent="ผูกบัญชีก่อนถึงจะใช้ระบบเพื่อนได้";
    show($("codeBox"),false);
    return;
  }

  const list=await api("/api/v1/friends",{method:"GET",headers:{Accept:"application/json"}});
  if(!list.res.ok){
    setMsg($("msg"), (list.data&&list.data.error)||"โหลดไม่สำเร็จ", false);
    return;
  }
  const data=list.data;
  const user=data.me||me.data.user;
  $("sub").textContent=user.displayName;
  show($("codeBox"), true);
  $("myCode").textContent=user.friendCode||"—";

  const fill=(elId,emptyId,items,makeActs)=>{
    const el=$(elId);
    el.innerHTML="";
    show($(emptyId), !items.length);
    items.forEach(item=>{
      const li=document.createElement("li");
      li.innerHTML=userRow(item.user);
      const acts=document.createElement("div");
      acts.style.display="flex";
      acts.style.gap="6px";
      makeActs(acts,item);
      li.appendChild(acts);
      el.appendChild(li);
    });
  };

  fill("incoming","incomingEmpty",data.incoming||[],(acts,item)=>{
    const a=btn("รับ");
    a.onclick=async()=>{
      const r=await api("/api/v1/friends/"+item.friendshipId+"/accept",{method:"POST",body:"{}"});
      setMsg($("msg"), r.res.ok?"เป็นเพื่อนแล้ว":"รับไม่สำเร็จ", r.res.ok);
      refresh();
    };
    const d=btn("ปฏิเสธ");
    d.onclick=async()=>{
      await api("/api/v1/friends/"+item.friendshipId+"/decline",{method:"POST",body:"{}"});
      refresh();
    };
    acts.append(a,d);
  });

  fill("outgoing","outgoingEmpty",data.outgoing||[],(acts,item)=>{
    const c=btn("ยกเลิก");
    c.onclick=async()=>{
      await api("/api/v1/friends/"+item.friendshipId,{method:"DELETE"});
      refresh();
    };
    acts.appendChild(c);
  });

  fill("friends","friendsEmpty",data.friends||[],(acts,item)=>{
    const r=btn("ลบ","danger");
    r.onclick=async()=>{
      if(!confirm("ลบเพื่อนคนนี้?")) return;
      await api("/api/v1/friends/"+item.friendshipId,{method:"DELETE"});
      refresh();
    };
    acts.appendChild(r);
  });
}

$("copyCode").onclick=async()=>{
  const t=$("myCode").textContent.trim();
  if(!t||t==="—") return;
  try{
    await navigator.clipboard.writeText(t);
    setMsg($("msg"),"คัดลอกแล้ว",true);
  }catch(e){
    setMsg($("msg"),t,true);
  }
};

$("codeForm").onsubmit=async(e)=>{
  e.preventDefault();
  await sendRequest({friendCode:$("friendCodeInput").value});
  $("friendCodeInput").value="";
};

let searchTimer=null;
$("searchInput").oninput=()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(async()=>{
    const q=$("searchInput").value.trim();
    const box=$("searchResults");
    box.innerHTML="";
    if(q.length<2) return;
    const r=await api("/api/v1/friends/search?q="+encodeURIComponent(q),{method:"GET",headers:{Accept:"application/json"}});
    (r.data&&r.data.users||[]).forEach(u=>{
      const li=document.createElement("li");
      li.innerHTML=userRow(u);
      const a=btn("เพิ่ม");
      a.onclick=()=>sendRequest({userId:u.id});
      li.appendChild(a);
      box.appendChild(li);
    });
  },250);
};

refresh();
</script>
</body>
</html>
