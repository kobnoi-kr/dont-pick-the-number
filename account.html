<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัญชี — NUMVERSE</title>
<link rel="icon" href="numverse.png" type="image/png">
<link rel="stylesheet" href="auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>Account</h1>
    <p class="sub" id="sub">กำลังโหลด…</p>

    <div id="guestPrompt" class="hidden">
      <p class="sub" style="text-align:left">คุณกำลังเล่นแบบ Guest — ผูกบัญชีเพื่อไม่ให้ข้อมูลหายเมื่อล้างคุกกี้</p>
      <div class="oauth-row">
        <a class="oauth-icon google" href="/api/v1/auth/google" aria-label="อัปเกรดด้วย Google" title="Google">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </a>
        <a class="oauth-icon discord" href="/api/v1/auth/discord" aria-label="อัปเกรดด้วย Discord" title="Discord">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path fill="#5865F2" d="M20.32 4.37A19.8 19.8 0 0 0 15.89 3l-.2.37a12.9 12.9 0 0 1 3.22 1.23 13.4 13.4 0 0 0-10.82 0A12.4 12.4 0 0 1 11.3 3.1L11.1 3A19.9 19.9 0 0 0 6.68 4.37C2.95 9.87 2.02 15.2 2.45 20.5A19.9 19.9 0 0 0 8.5 23.3l.74-1.17a13 13 0 0 1-1.88-.9l.36-.28c3.7 1.7 7.7 1.7 11.36 0l.36.28c-.6.35-1.23.64-1.88.9l.74 1.17a19.8 19.8 0 0 0 6.05-2.8c.5-5.5-.84-10.78-3.63-16.13zM8.68 16.82c-1.2 0-2.18-1.1-2.18-2.45S7.48 11.9 8.68 11.9s2.2 1.11 2.18 2.47-1 2.45-2.18 2.45zm6.64 0c-1.2 0-2.18-1.1-2.18-2.45s.98-2.47 2.18-2.47 2.2 1.11 2.18 2.47-1 2.45-2.18 2.45z"/>
          </svg>
        </a>
      </div>
    </div>

    <form id="profileForm" class="hidden">
      <div class="avatar-block">
        <img id="avatarPreview" class="avatar-preview" src="" alt="" width="72" height="72">
        <div class="avatar-actions">
          <label class="btn ghost avatar-file-label">เลือกรูป
            <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </label>
          <button class="btn ghost" id="avatarClear" type="button">ลบรูป</button>
        </div>
      </div>
      <label>ชื่อที่แสดง
        <input id="displayName" type="text" maxlength="64" required>
      </label>
      <button class="btn" type="submit">บันทึกโปรไฟล์</button>
    </form>

    <h1 style="margin-top:22px;font-size:1.05rem;text-align:left">Connected Accounts</h1>
    <p class="tiny" style="margin:0 0 8px;text-align:left">เชื่อม Google และ Discord ได้ทั้งคู่ในโปรไฟล์เดียว</p>
    <ul class="list" id="providers"></ul>
    <div class="oauth-row" id="linkRow" style="justify-content:flex-start;margin-top:12px">
      <a class="oauth-icon google" id="linkGoogle" href="/api/v1/auth/link/google" aria-label="เชื่อม Google" title="เชื่อม Google">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </a>
      <a class="oauth-icon discord" id="linkDiscord" href="/api/v1/auth/link/discord" aria-label="เชื่อม Discord" title="เชื่อม Discord">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="#5865F2" d="M20.32 4.37A19.8 19.8 0 0 0 15.89 3l-.2.37a12.9 12.9 0 0 1 3.22 1.23 13.4 13.4 0 0 0-10.82 0A12.4 12.4 0 0 1 11.3 3.1L11.1 3A19.9 19.9 0 0 0 6.68 4.37C2.95 9.87 2.02 15.2 2.45 20.5A19.9 19.9 0 0 0 8.5 23.3l.74-1.17a13 13 0 0 1-1.88-.9l.36-.28c3.7 1.7 7.7 1.7 11.36 0l.36.28c-.6.35-1.23.64-1.88.9l.74 1.17a19.8 19.8 0 0 0 6.05-2.8c.5-5.5-.84-10.78-3.63-16.13zM8.68 16.82c-1.2 0-2.18-1.1-2.18-2.45S7.48 11.9 8.68 11.9s2.2 1.11 2.18 2.47-1 2.45-2.18 2.45zm6.64 0c-1.2 0-2.18-1.1-2.18-2.45s.98-2.47 2.18-2.47 2.2 1.11 2.18 2.47-1 2.45-2.18 2.45z"/>
        </svg>
      </a>
    </div>

    <h1 style="margin-top:22px;font-size:1.05rem;text-align:left">Sessions</h1>
    <ul class="list" id="sessions"></ul>

    <button class="btn ghost" id="logout" type="button">Logout</button>
    <button class="btn ghost" id="logoutAll" type="button">Logout ทุกอุปกรณ์</button>
    <p class="msg" id="msg"></p>
    <p class="links"><a href="/">กลับล็อบบี้</a></p>
  </div>
</div>
<script src="auth-client.js"></script>
<script>
function $(id){return document.getElementById(id)}
function show(el,on){el.classList.toggle("hidden",!on)}

let pendingAvatar=undefined; // undefined=unchanged, null=clear, string=new

function paintAvatar(url){
  const img=$("avatarPreview");
  if(url){
    img.src=url;
    img.classList.add("on");
    img.alt="Avatar";
  }else{
    img.removeAttribute("src");
    img.classList.remove("on");
    img.alt="";
  }
}

function resizeImageFile(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type)) return reject(new Error("invalid_file"));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("read_failed"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("decode_failed"));
      img.onload=()=>{
        const size=96;
        const canvas=document.createElement("canvas");
        canvas.width=size;
        canvas.height=size;
        const ctx=canvas.getContext("2d");
        const side=Math.min(img.width,img.height);
        const sx=(img.width-side)/2;
        const sy=(img.height-side)/2;
        ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
        const dataUrl=canvas.toDataURL("image/jpeg",0.72);
        if(dataUrl.length>24000) return reject(new Error("too_large"));
        resolve(dataUrl);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function refresh(){
  const me=await api("/api/v1/auth/me",{method:"GET",headers:{Accept:"application/json"}});
  if(!me.res.ok){
    $("sub").textContent="ยังไม่ได้เข้าสู่ระบบ";
    location.href="login.html";
    return;
  }
  const user=me.data.user;
  $("sub").textContent=user.displayName+" · "+user.accountType+(user.roles&&user.roles.length?" · "+user.roles.join(","):"");
  show($("guestPrompt"), user.accountType==="guest");
  show($("profileForm"), true);
  $("displayName").value=user.displayName||"";
  pendingAvatar=undefined;
  paintAvatar(user.avatarUrl||"");

  const prov=await api("/api/v1/account/providers",{method:"GET",headers:{Accept:"application/json"}});
  const providers=prov.data&&prov.data.providers||[];
  const linked=new Set(providers.map(p=>p.provider));
  $("providers").innerHTML="";
  providers.forEach(p=>{
    const li=document.createElement("li");
    li.innerHTML="<span>"+p.provider+(p.providerEmail?" · "+p.providerEmail:"")+"</span>";
    const btn=document.createElement("button");
    btn.className="btn ghost";
    btn.style.width="auto";
    btn.style.margin=0;
    btn.style.padding="8px 12px";
    btn.textContent="ยกเลิกเชื่อม";
    btn.onclick=async()=>{
      const r=await api("/api/v1/account/unlink/"+p.provider,{method:"DELETE",headers:{Accept:"application/json"}});
      const map={
        last_provider:"ถอดไม่ได้ — นี่คือวิธีล็อกอินสุดท้าย เชื่อม Discord/Google อีกอันก่อน",
        provider_not_linked:"ยังไม่ได้เชื่อมวิธีนี้",
        cannot_unlink:"ถอดการเชื่อมไม่สำเร็จ"
      };
      const err=r.data&&r.data.error;
      setMsg($("msg"), r.res.ok?"ยกเลิกแล้ว":(map[err]||err||"ล้มเหลว"), r.res.ok);
      refresh();
    };
    li.appendChild(btn);
    $("providers").appendChild(li);
  });

  const canLink=user.accountType==="registered";
  show($("linkGoogle"), canLink&&!linked.has("google"));
  show($("linkDiscord"), canLink&&!linked.has("discord"));
  show($("linkRow"), canLink&&(!linked.has("google")||!linked.has("discord")));

  const sess=await api("/api/v1/account/sessions",{method:"GET",headers:{Accept:"application/json"}});
  $("sessions").innerHTML="";
  (sess.data&&sess.data.sessions||[]).forEach(s=>{
    const li=document.createElement("li");
    li.innerHTML="<div><div>"+(s.userAgent||"device").slice(0,48)+"</div><div class='tiny'>"+(s.ipAddress||"")+" · "+new Date(s.lastSeenAt).toLocaleString()+"</div></div>";
    if(s.current){
      const b=document.createElement("span");
      b.className="badge on";
      b.textContent="เครื่องนี้";
      li.appendChild(b);
    }else{
      const btn=document.createElement("button");
      btn.className="btn ghost";
      btn.style.width="auto";
      btn.style.margin=0;
      btn.style.padding="8px 12px";
      btn.textContent="revoke";
      btn.onclick=async()=>{
        await api("/api/v1/account/sessions/"+s.id,{method:"DELETE",headers:{Accept:"application/json"}});
        refresh();
      };
      li.appendChild(btn);
    }
    $("sessions").appendChild(li);
  });
}

$("avatarFile").onchange=async(e)=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file) return;
  try{
    const dataUrl=await resizeImageFile(file);
    pendingAvatar=dataUrl;
    paintAvatar(dataUrl);
    setMsg($("msg"),"เลือกรูปแล้ว — กดบันทึกโปรไฟล์",true);
  }catch(err){
    setMsg($("msg"),"อัปโหลดรูปไม่สำเร็จ (ลองไฟล์เล็กกว่า)",false);
  }
};
$("avatarClear").onclick=()=>{
  pendingAvatar=null;
  paintAvatar("");
  setMsg($("msg"),"จะลบรูปเมื่อกดบันทึก",true);
};

$("profileForm").onsubmit=async(e)=>{
  e.preventDefault();
  const body={displayName:$("displayName").value};
  if(pendingAvatar!==undefined) body.avatarUrl=pendingAvatar;
  const {res,data}=await api("/api/v1/account/profile",{
    method:"PATCH",
    body:JSON.stringify(body)
  });
  const err=data&&data.error;
  const map={invalid_avatar:"รูปไม่ถูกต้องหรือใหญ่เกินไป",invalid_input:"ใส่ชื่อก่อน"};
  setMsg($("msg"), res.ok?"บันทึกแล้ว":(map[err]||err||"บันทึกไม่สำเร็จ"), res.ok);
  if(res.ok) refresh();
};
$("logout").onclick=async()=>{
  await api("/api/v1/auth/logout",{method:"POST",body:"{}"});
  location.href="/";
};
$("logoutAll").onclick=async()=>{
  await api("/api/v1/auth/logout-all",{method:"POST",body:"{}"});
  location.href="login.html";
};
refresh();
</script>
</body>
</html>
