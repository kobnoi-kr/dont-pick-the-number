<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลืมรหัสผ่าน — NUMVERSE</title>
<link rel="icon" href="numverse.png" type="image/png">
<link rel="stylesheet" href="auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>Forgot Password</h1>
    <p class="sub">ใส่อีเมลเพื่อรับลิงก์รีเซ็ตรหัสผ่าน</p>
    <form id="form">
      <label>อีเมล
        <input id="email" type="email" required autocomplete="email">
      </label>
      <button class="btn" type="submit">ส่งลิงก์</button>
    </form>
    <p class="msg" id="msg"></p>
    <p class="links"><a href="login.html">กลับไปเข้าสู่ระบบ</a></p>
  </div>
</div>
<script src="auth-client.js"></script>
<script>
document.getElementById("form").onsubmit=async (e)=>{
  e.preventDefault();
  const msg=document.getElementById("msg");
  setMsg(msg,"กำลังส่ง…",true);
  const {res,data}=await api("/api/v1/auth/forgot-password",{
    method:"POST",
    body:JSON.stringify({email:document.getElementById("email").value})
  });
  setMsg(msg,"ถ้ามีบัญชีนี้ ระบบจะส่งอีเมลให้",true);
  if(data&&data.previewLink) location.href=data.previewLink;
};
</script>
</body>
</html>
