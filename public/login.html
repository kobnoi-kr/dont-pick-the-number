<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — NUMVERSE</title>
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/images/numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>Welcome Back</h1>
    <p class="sub">เข้าสู่ระบบด้วย Google หรือ Discord</p>
    <div class="oauth-row">
      <a class="oauth-icon google" id="googleBtn" href="/api/v1/auth/google" aria-label="Login with Google" title="Google">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </a>
      <a class="oauth-icon discord" id="discordBtn" href="/api/v1/auth/discord" aria-label="Login with Discord" title="Discord">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="#5865F2" d="M20.32 4.37A19.8 19.8 0 0 0 15.89 3l-.2.37a12.9 12.9 0 0 1 3.22 1.23 13.4 13.4 0 0 0-10.82 0A12.4 12.4 0 0 1 11.3 3.1L11.1 3A19.9 19.9 0 0 0 6.68 4.37C2.95 9.87 2.02 15.2 2.45 20.5A19.9 19.9 0 0 0 8.5 23.3l.74-1.17a13 13 0 0 1-1.88-.9l.36-.28c3.7 1.7 7.7 1.7 11.36 0l.36.28c-.6.35-1.23.64-1.88.9l.74 1.17a19.8 19.8 0 0 0 6.05-2.8c.5-5.5-.84-10.78-3.63-16.13zM8.68 16.82c-1.2 0-2.18-1.1-2.18-2.45S7.48 11.9 8.68 11.9s2.2 1.11 2.18 2.47-1 2.45-2.18 2.45zm6.64 0c-1.2 0-2.18-1.1-2.18-2.45s.98-2.47 2.18-2.47 2.2 1.11 2.18 2.47-1 2.45-2.18 2.45z"/>
        </svg>
      </a>
    </div>
    <p class="msg" id="msg"></p>
    <p class="links"><a href="/">หน้าแรก</a> · <a href="/app">Dashboard</a> · <a href="/terms">ข้อกำหนด</a> · <a href="/faq">FAQ</a></p>
    <p class="sub" style="margin-top:12px;font-size:.8rem">การเข้าใช้ถือว่ายอมรับข้อกำหนด · เราเก็บ IP ไว้เพื่อความปลอดภัยแต่ไม่เปิดเผยต่อผู้เล่นอื่น</p>
  </div>
</div>
<script src="/js/auth-client.js"></script>
<script>
(async function(){
  function $(id){ return document.getElementById(id); }
  const msg=$("msg");
  const err=qs("error");
  const next=qs("next");
  if(next==="/admin" || next==="/admin.html" || (next&&next.indexOf("/admin")===0)){
    setMsg(msg, "ล็อกอินด้วยบัญชีแอดมิน (Google/Discord) แล้วจะเข้าหน้า Admin ได้", true);
  }
  if(err){
    const map={
      provider_already_linked:"บัญชี Google/Discord นี้ถูกผูกกับบัญชีอื่นแล้ว — กดโลโก้อีกครั้งเพื่อเข้าบัญชีนั้น หรือเล่น Guest ใหม่แล้วลองใหม่",
      last_provider:"ถอดไม่ได้ — นี่คือวิธีล็อกอินสุดท้าย",
      oauth_exchange_failed:"แลกสิทธิ์ล้มเหลว ลองใหม่",
      invalid_oauth_state:"เซสชันหมดอายุ ลองกดโลโก้อีกครั้ง",
      account_blocked:"บัญชีถูกระงับ"
    };
    setMsg(msg, map[err]||("เข้าสู่ระบบไม่สำเร็จ: "+err), false);
  }

  // After OAuth, bounce back to admin if requested
  try{
    const me=await fetch("/api/v1/auth/me",{credentials:"same-origin",headers:{Accept:"application/json"}});
    if(me.ok){
      const data=await me.json();
      const roles=(data.user&&data.user.roles)||[];
      const isAdmin=roles.includes("admin")||roles.includes("super_admin")||roles.includes("moderator");
      if(isAdmin && (next==="/admin" || next==="/admin.html" || (next&&next.indexOf("/admin")===0))){
        location.href="/admin";
        return;
      }
    }
  }catch(_){}

  const providers=await loadProviders();
  if(!providers.authEnabled){
    setMsg(msg, "Auth ยังไม่เปิด (ตั้ง DATABASE_URL)", false);
  }
  if(!(providers.providers||[]).includes("google")) $("googleBtn").style.display="none";
  if(!(providers.providers||[]).includes("discord")) $("discordBtn").style.display="none";

  // Remember next so after OAuth return we can send them to admin
  if(next && next.charAt(0)==="/"){
    try{ sessionStorage.setItem("nv-login-next", next); }catch(_){}
  }
  const storedNext=(function(){ try{ return sessionStorage.getItem("nv-login-next"); }catch(_){ return null; } })();
  if(storedNext && !next){
    // OAuth came back to /login.html without query — check me and redirect
    try{
      const me=await fetch("/api/v1/auth/me",{credentials:"same-origin",headers:{Accept:"application/json"}});
      if(me.ok){
        const data=await me.json();
        const roles=(data.user&&data.user.roles)||[];
        const isAdmin=roles.includes("admin")||roles.includes("super_admin")||roles.includes("moderator");
        if(isAdmin && storedNext.indexOf("/admin")===0){
          try{ sessionStorage.removeItem("nv-login-next"); }catch(_){}
          location.href=storedNext;
          return;
        }
      }
    }catch(_){}
  }
})();
</script>
</body>
</html>
