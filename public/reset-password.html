<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งรหัสผ่านใหม่ — NUMVERSE</title>
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/images/numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>Reset Password</h1>
    <p class="sub">ตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
    <form id="form">
      <label>รหัสผ่านใหม่
        <input id="password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <button class="btn" type="submit">บันทึกรหัสผ่าน</button>
    </form>
    <p class="msg" id="msg"></p>
    <p class="links"><a href="/login">ไปหน้าเข้าสู่ระบบ</a></p>
  </div>
</div>
<script src="/js/auth-client.js"></script>
<script>
const token=qs("token");
const msg=document.getElementById("msg");
if(!token) setMsg(msg,"ลิงก์ไม่ถูกต้อง",false);
document.getElementById("form").onsubmit=async (e)=>{
  e.preventDefault();
  if(!token) return;
  const {res,data}=await api("/api/v1/auth/reset-password",{
    method:"POST",
    body:JSON.stringify({token, password:document.getElementById("password").value})
  });
  if(!res.ok){
    setMsg(msg, (data&&data.error)==="weak_password"?"รหัสผ่านอ่อนเกินไป":"รีเซ็ตไม่สำเร็จ", false);
    return;
  }
  setMsg(msg,"ตั้งรหัสผ่านใหม่แล้ว เข้าสู่ระบบได้เลย",true);
  setTimeout(()=>location.href="/login",800);
};
</script>
</body>
</html>
