<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUMVERSE</title>
<meta name="application-name" content="NUMVERSE">
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/n-logo.png">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="/" class="brand-link">
        <img class="brand-mark" src="/images/n-logo.png" alt="" width="42" height="42">
        <span>NUMVERSE</span>
      </a>
      <span class="role-badge" id="roleBadge">USER</span>
    </div>
    <nav class="nav" id="sideNav">
      <div class="nav-section">MAIN MENU</div>
      <button type="button" data-view="overview" class="active"><span class="ico">◈</span> Overview</button>
      <button type="button" data-view="library"><span class="ico">▣</span> Game Library</button>
      <button type="button" data-view="rooms"><span class="ico">⌂</span> My Rooms</button>
      <button type="button" data-view="friends"><span class="ico">☺</span> Friends</button>
      <div class="nav-section">ACCOUNT</div>
      <button type="button" data-view="profile"><span class="ico">⚙</span> Profile &amp; Settings</button>
      <a class="admin-nav hidden" id="adminNavBtn" href="/admin.html"><span class="ico">🛡</span> Admin Dashboard</a>
    </nav>
    <div class="sidebar-user">
      <div id="sideAvatar" class="avatar-fallback">?</div>
      <div class="meta">
        <div class="name" id="sideName">Loading…</div>
        <div class="status" id="sideStatus">—</div>
      </div>
      <button type="button" class="logout" id="sideLogout" title="Logout">⎋</button>
    </div>
  </aside>

  <header class="topbar">
    <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <h1 id="pageTitle">Overview</h1>
    <a class="btn ghost sm home-link" href="/">หน้าแรก</a>
    <button type="button" class="icon-btn" id="notifBtn" aria-label="Notifications">🔔<span class="badge-dot hidden" id="notifDot"></span></button>
    <button type="button" class="icon-btn" id="userMenuBtn" aria-label="Account">👤</button>
  </header>

  <main class="main">
    <div id="guestBanner" class="guest-banner hidden">
      <div class="grow">กำลังเล่นแบบ Guest — ผูกบัญชีเพื่อเก็บความคืบหน้า</div>
      <a class="btn sm" href="#profile">ผูกบัญชี</a>
      <button type="button" class="btn ghost sm" id="guestContinue">ดำเนินการต่อ</button>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation">
  <button type="button" data-view="overview" class="active">Overview</button>
  <button type="button" data-view="library">Games</button>
  <button type="button" data-view="rooms">Rooms</button>
  <button type="button" data-view="friends">Friends</button>
  <button type="button" data-view="profile">Me</button>
</nav>

<div id="backdrop" class="backdrop hidden"></div>

<div id="notifPanel" class="card notif-panel hidden">
  <div class="notif-head">
    <div>
      <h3 class="notif-title">การแจ้งเตือน</h3>
      <p class="notif-sub" id="notifSub">ทั้งหมด 0 รายการ</p>
    </div>
    <div class="notif-head-actions">
      <button type="button" class="btn ghost sm" id="notifMarkAll">อ่านทั้งหมด</button>
      <button type="button" class="btn ghost sm danger-text" id="notifDeleteAll">ลบทั้งหมด</button>
    </div>
  </div>
  <div class="notif-cats" id="notifCats" role="tablist" aria-label="หมวดหมู่การแจ้งเตือน"></div>
  <div class="notif-toolbar hidden" id="notifToolbar">
    <label class="notif-select-all">
      <input type="checkbox" id="notifSelectAll" aria-label="เลือกทั้งหมด">
      <span>เลือกทั้งหมด</span>
    </label>
    <button type="button" class="btn sm hidden" id="notifDeleteSelected" disabled>ลบที่เลือก</button>
  </div>
  <ul class="list notif-list" id="notifList"></ul>
  <p class="empty tiny notif-empty" id="notifEmpty">ยังไม่มีการแจ้งเตือน</p>
</div>

<div id="createModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3>สร้างห้อง</h3>
    <p class="muted" id="crHint">เลือกเกม ตั้งชื่อห้อง แล้วเข้าล็อบบี้</p>
    <div class="form-grid">
      <label id="crCatField">เกม
        <div class="vis-toggle game-pick-toggle" id="crCatToggle" role="group" aria-label="เลือกเกม">
          <button type="button" class="vis-opt on" data-cat="secret">
            <span class="cr-game-ico" aria-hidden="true">🔢</span>
            <span>หาเลข</span>
          </button>
          <button type="button" class="vis-opt" data-cat="wheel">
            <span class="cr-game-ico" aria-hidden="true">🎡</span>
            <span>วงล้อ</span>
          </button>
        </div>
        <input type="hidden" id="crCat" value="secret">
      </label>
      <label>ชื่อห้อง<input id="crName" maxlength="32" placeholder="ห้องของฉัน"></label>
      <label>การมองเห็น
        <div class="vis-toggle" id="crVisToggle" role="group" aria-label="การมองเห็น">
          <button type="button" class="vis-opt on" data-vis="public">Public</button>
          <button type="button" class="vis-opt" data-vis="private">Private</button>
        </div>
        <input type="hidden" id="crVis" value="public">
      </label>
    </div>
    <p class="msg" id="crMsg"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="crCancel">ยกเลิก</button>
      <button type="button" class="btn" id="crSubmit">เข้าล็อบบี้</button>
    </div>
  </div>
</div>

<script src="/js/dashboard/runtime-config.js"></script>
<script type="module" src="/js/dashboard/app.js"></script>
</body>
</html>
