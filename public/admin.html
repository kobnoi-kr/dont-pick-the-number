<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — NUMVERSE</title>
<meta name="application-name" content="NUMVERSE">
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app admin-app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="/admin" class="brand-link brand-link-logo">
        <img class="brand-wordmark" src="/images/numverse.png" alt="NUMVERSE" width="180" height="68">
      </a>
      <span class="role-badge admin" id="roleBadge">ADMIN</span>
    </div>
    <nav class="nav" id="sideNav">
      <div class="nav-section">DASHBOARD</div>
      <button type="button" data-view="overview" data-perm="dashboard.view" class="active"><span class="ico">◈</span> Overview</button>
      <button type="button" data-view="analytics" data-perm="analytics.view"><span class="ico">◔</span> Analytics</button>
      <button type="button" data-view="live" data-perm="rooms.view"><span class="ico">⌁</span> Live Monitor</button>
      <div class="nav-section">MANAGEMENT</div>
      <button type="button" data-view="users" data-perm="users.view"><span class="ico">☺</span> User Management</button>
      <button type="button" data-view="games" data-perm="games.view"><span class="ico">▣</span> Game Management</button>
      <button type="button" data-view="rooms" data-perm="rooms.view"><span class="ico">⌂</span> Room Management</button>
      <button type="button" data-view="announcements" data-perm="announcements.manage"><span class="ico">◎</span> Announcements</button>
      <div class="nav-section">SYSTEM</div>
      <button type="button" data-view="permissions" data-perm="admins.view"><span class="ico">🛡</span> Admin &amp; Permissions</button>
      <button type="button" data-view="system" data-perm="settings.view"><span class="ico">▤</span> System Management</button>
      <button type="button" data-view="logs" data-perm="logs.view"><span class="ico">☰</span> Activity Logs</button>
      <button type="button" data-view="settings" data-perm="settings.view"><span class="ico">⚙</span> Settings</button>
      <div class="nav-section">ACCOUNT</div>
      <a class="admin-nav" href="/app"><span class="ico">←</span> User Dashboard</a>
    </nav>
    <div class="sidebar-user">
      <div id="sideAvatar" class="avatar-fallback">?</div>
      <div class="meta">
        <div class="name" id="sideName">Loading…</div>
        <div class="status" id="sideStatus">—</div>
      </div>
      <button type="button" class="logout" id="sideLogout" title="Logout">⎋</button>
    </div>
  </aside>

  <header class="topbar">
    <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <h1 id="pageTitle">Overview</h1>
    <a class="btn ghost sm home-link" href="/">หน้าแรก</a>
  </header>

  <main class="main">
    <div id="viewRoot"><div class="loading">กำลังโหลด Admin…</div></div>
  </main>
</div>

<div id="backdrop" class="backdrop hidden"></div>

<script type="module" src="/js/admin/app.js"></script>
</body>
</html>
