<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — NUMVERSE</title>
<meta name="application-name" content="NUMVERSE">
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app admin-app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <a href="/admin" class="brand-link brand-link-logo">
        <img class="brand-wordmark" src="/images/numverse.png" alt="NUMVERSE" width="180" height="68">
      </a>
      <span class="role-badge admin" id="roleBadge">ADMIN</span>
    </div>
    <nav class="nav" id="sideNav">
      <div class="nav-section">DASHBOARD</div>
      <button type="button" data-view="overview" data-perm="dashboard.view" class="active"><i class="fi fi-rr-dashboard ico" aria-hidden="true"></i> Overview</button>
      <button type="button" data-view="analytics" data-perm="analytics.view"><i class="fi fi-rr-chart-histogram ico" aria-hidden="true"></i> Analytics</button>
      <button type="button" data-view="live" data-perm="rooms.view"><i class="fi fi-rr-live ico" aria-hidden="true"></i> Live Monitor</button>
      <div class="nav-section">MANAGEMENT</div>
      <button type="button" data-view="users" data-perm="users.view"><i class="fi fi-rr-users ico" aria-hidden="true"></i> User Management</button>
      <button type="button" data-view="games" data-perm="games.view"><i class="fi fi-rr-gamepad ico" aria-hidden="true"></i> Game Management</button>
      <button type="button" data-view="rooms" data-perm="rooms.view"><i class="fi fi-rr-door-open ico" aria-hidden="true"></i> Room Management</button>
      <button type="button" data-view="announcements" data-perm="announcements.manage"><i class="fi fi-rr-megaphone ico" aria-hidden="true"></i> Announcements</button>
      <div class="nav-section">SYSTEM</div>
      <button type="button" data-view="permissions" data-perm="admins.view"><i class="fi fi-rr-shield-check ico" aria-hidden="true"></i> Admin &amp; Permissions</button>
      <button type="button" data-view="system" data-perm="settings.view"><i class="fi fi-rr-computer ico" aria-hidden="true"></i> System Management</button>
      <button type="button" data-view="logs" data-perm="logs.view"><i class="fi fi-rr-list ico" aria-hidden="true"></i> User / Admin Logs</button>
      <button type="button" data-view="settings" data-perm="settings.view"><i class="fi fi-rr-settings ico" aria-hidden="true"></i> Settings</button>
      <div class="nav-section">ACCOUNT</div>
      <a class="admin-nav" href="/app"><i class="fi fi-rr-arrow-left ico" aria-hidden="true"></i> User Dashboard</a>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div id="sideAvatar" class="avatar-fallback">?</div>
        <div class="meta">
          <div class="name" id="sideName">Loading…</div>
          <div class="status" id="sideStatus">—</div>
        </div>
        <button type="button" class="logout" id="sideLogout" title="Logout" aria-label="Logout">
          <img src="/images/power-off.png" alt="" width="18" height="18" decoding="async">
        </button>
      </div>
      <p class="sidebar-legal"><a href="/terms">ข้อกำหนด</a> · <a href="/faq">FAQ</a></p>
    </div>
  </aside>

  <header class="topbar">
    <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu"><i class="fi fi-rr-menu-burger" aria-hidden="true"></i></button>
    <h1 id="pageTitle">Overview</h1>
    <a class="btn ghost sm home-link" href="/">หน้าแรก</a>
  </header>

  <main class="main">
    <div id="viewRoot"><div class="loading">กำลังโหลด Admin…</div></div>
  </main>
</div>

<div id="backdrop" class="backdrop hidden"></div>

<script type="module" src="/js/admin/app.js"></script>
</body>
</html>
