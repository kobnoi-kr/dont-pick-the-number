<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ยืนยันอีเมล — NUMVERSE</title>
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/images/numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>Verify Email</h1>
    <p class="sub" id="sub">กำลังยืนยันอีเมล…</p>
    <p class="msg" id="msg"></p>
    <p class="links"><a href="/login">เข้าสู่ระบบ</a> · <a href="/">ไปล็อบบี้</a></p>
  </div>
</div>
<script src="/js/auth-client.js"></script>
<script>
(async function(){
  const token=qs("token");
  const msg=document.getElementById("msg");
  if(!token){
    document.getElementById("sub").textContent="ลิงก์ไม่ถูกต้อง";
    setMsg(msg,"ไม่พบ token",false);
    return;
  }
  const {res,data}=await api("/api/v1/auth/verify-email",{
    method:"POST",
    body:JSON.stringify({token})
  });
  if(!res.ok){
    document.getElementById("sub").textContent="ยืนยันไม่สำเร็จ";
    setMsg(msg,"โทเคนหมดอายุหรือถูกใช้แล้ว",false);
    return;
  }
  document.getElementById("sub").textContent="ยืนยันอีเมลสำเร็จ";
  setMsg(msg,"บัญชีพร้อมใช้งานแล้ว",true);
  setTimeout(()=>location.href="/",1000);
})();
</script>
</body>
</html>
