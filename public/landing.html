<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUMVERSE</title>
<meta name="application-name" content="NUMVERSE">
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/images/n-logo.png">
<link rel="preload" as="image" href="/images/n-logo.png">
<style>
html,body{background:#070b14}
.nv-boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;margin:0;padding:24px;background:linear-gradient(180deg,#0c1220 0%,#070b14 100%);color:#e8eefc}
.nv-boot.is-done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .38s ease,visibility .38s ease}
.nv-boot-inner{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.nv-boot-logo{width:min(96px,28vw);height:auto;display:block;border-radius:18px}
.nv-boot-word{margin:0;font:700 1.05rem/1.2 system-ui,sans-serif;letter-spacing:.14em}
.nv-boot-bar{width:min(120px,36vw);height:3px;border-radius:999px;background:rgba(148,163,184,.18);overflow:hidden}
.nv-boot-bar>span{display:block;height:100%;width:40%;border-radius:inherit;background:#6b88ff;animation:nv-boot-slide 1.1s ease-in-out infinite}
.nv-boot-label{margin:0;font:500 .78rem/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(186,198,220,.72)}
@keyframes nv-boot-slide{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
</style>
<link rel="stylesheet" href="/css/boot-splash.css">
<link rel="stylesheet" href="/css/scrollbar.css">
<link rel="stylesheet" href="/css/landing.css">
</head>
<body>
  <div id="nvBoot" class="nv-boot" aria-busy="true" aria-live="polite" role="status">
    <div class="nv-boot-inner">
      <img class="nv-boot-logo" src="/images/n-logo.png" alt="NUMVERSE" width="96" height="96" decoding="sync" fetchpriority="high">
      <p class="nv-boot-word">NUMVERSE</p>
      <div class="nv-boot-bar" aria-hidden="true"><span></span></div>
      <p class="nv-boot-label">Loading</p>
    </div>
  </div>
  <script src="/js/boot-splash.js"></script>
  <main class="landing">
    <header class="landing-profile" id="profileChip">
      <a class="profile-link" id="profileLink" href="/login">
        <span class="avatar" id="landAvatar" aria-hidden="true">?</span>
        <span class="profile-meta">
          <span class="profile-label" id="landLabel">เข้าสู่ระบบ</span>
          <span class="profile-name" id="landName">Guest</span>
        </span>
      </a>
    </header>

    <div class="landing-hero">
      <img class="landing-logo" src="/images/numverse.png" alt="NUMVERSE" width="640" height="360" decoding="async">
      <h1 class="sr-only">NUMVERSE</h1>
      <p class="landing-tag">จุดรวมบอร์ดเกม · เกมกระดานหลากหลายในที่เดียว</p>
      <a class="btn start" id="startBtn" href="/app">Start</a>
      <p class="landing-legal"><a href="/terms">ข้อกำหนด</a> · <a href="/faq">FAQ</a></p>
    </div>
  </main>
  <script type="module" src="/js/landing.js"></script>
</body>
</html>
