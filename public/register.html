<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผูกบัญชี — NUMVERSE</title>
<link rel="icon" href="/images/n-logo.png" type="image/png">
<link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/images/numverse.png" alt="NUMVERSE" width="240" height="135"></div>
  <div class="panel">
    <h1>ผูกบัญชี</h1>
    <p class="sub">เลือก Google หรือ Discord เพื่อเก็บประวัติและล็อกอินข้ามเครื่อง<br><span class="tiny">ถ้ากำลังเล่นแบบ Guest ระบบจะอัปเกรดบัญชีเดิมให้อัตโนมัติ</span></p>
    <div class="oauth-row">
      <a class="oauth-icon google" id="googleBtn" href="/api/v1/auth/google" aria-label="Continue with Google" title="Google">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </a>
      <a class="oauth-icon discord" id="discordBtn" href="/api/v1/auth/discord" aria-label="Continue with Discord" title="Discord">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="#5865F2" d="M20.32 4.37A19.8 19.8 0 0 0 15.89 3l-.2.37a12.9 12.9 0 0 1 3.22 1.23 13.4 13.4 0 0 0-10.82 0A12.4 12.4 0 0 1 11.3 3.1L11.1 3A19.9 19.9 0 0 0 6.68 4.37C2.95 9.87 2.02 15.2 2.45 20.5A19.9 19.9 0 0 0 8.5 23.3l.74-1.17a13 13 0 0 1-1.88-.9l.36-.28c3.7 1.7 7.7 1.7 11.36 0l.36.28c-.6.35-1.23.64-1.88.9l.74 1.17a19.8 19.8 0 0 0 6.05-2.8c.5-5.5-.84-10.78-3.63-16.13zM8.68 16.82c-1.2 0-2.18-1.1-2.18-2.45S7.48 11.9 8.68 11.9s2.2 1.11 2.18 2.47-1 2.45-2.18 2.45zm6.64 0c-1.2 0-2.18-1.1-2.18-2.45s.98-2.47 2.18-2.47 2.2 1.11 2.18 2.47-1 2.45-2.18 2.45z"/>
        </svg>
      </a>
    </div>
    <p class="msg" id="msg"></p>
    <p class="links">มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a> · <a href="/">หน้าแรก</a> · <a href="/terms">ข้อกำหนด</a> · <a href="/faq">FAQ</a></p>
  </div>
</div>
<script src="/js/auth-client.js"></script>
<script>
(async function(){
  const msg=document.getElementById("msg");
  const providers=await loadProviders();
  if(!providers.authEnabled){
    setMsg(msg, "Auth ยังไม่เปิด (ตั้ง DATABASE_URL)", false);
  }
  if(!(providers.providers||[]).includes("google")) document.getElementById("googleBtn").style.display="none";
  if(!(providers.providers||[]).includes("discord")) document.getElementById("discordBtn").style.display="none";
})();
</script>
</body>
</html>
