services:
  - type: web
    name: dont-pick-the-number
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_BASE_URL
        value: https://numverse.click
      - key: ENFORCE_HOST
        value: "1"
      - key: ALLOWED_HOSTS
        value: numverse.click,www.numverse.click
      - key: EMBEDDED_PG
        value: "0"
      - key: ADMIN_PORT
        value: "0"
      - key: PUBLIC_DASHBOARD
        value: "1"
      - key: DASHBOARD_ADMIN_ONLY
        value: "0"
      - key: SUPER_ADMIN_EMAILS
        value: kimgamerchannal@gmail.com
      - key: AUTH_SECRET
        generateValue: true
      # Set DATABASE_URL (+ Google/Discord OAuth) in the Render dashboard
      # - key: DATABASE_URL
      #   sync: false
